# .github/ISSUE_TEMPLATE/feature.yml
name: ✨ Feature Request
description: Propose a new manifest or GitOps change for python-fawkes-path
title: "[Feature]: "
# Only labels that already exist in this repo are listed; "area:unknown"
# (used by uFawkesDevX's template) does not exist here.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Summary & Motivation
        Briefly describe the change and why it's needed.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the manifest change or new resource you are proposing.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Target Manifest
      options:
        - kustomization.yaml
        - deployment.yaml
        - service.yaml / ingress.yaml
        - serviceaccount.yaml
        - servicemonitor.yaml
        - Documentation (README)
      validations:
        required: true

  - type: checkboxes
    id: copilot
    attributes:
      label: Copilot Readiness
      options:
        - label: Ready for Copilot agent (clear scope, tests defined)
          required: false
