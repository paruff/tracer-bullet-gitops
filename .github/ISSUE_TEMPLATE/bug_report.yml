# .github/ISSUE_TEMPLATE/bug_report.yml
name: 🐛 Bug Report
description: Report a bug in python-fawkes-path-gitops (manifests, kustomization, ArgoCD sync)
title: "[Bug]: "
# Only labels that already exist in this repo are listed. uFawkesDevX's
# template also sets "needs-triage"; this repo has no such label.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: e.g. ArgoCD reports a drift on ServiceMonitor after the sync
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Manifest
      options:
        - kustomization.yaml
        - deployment.yaml
        - service.yaml / ingress.yaml
        - serviceaccount.yaml
        - servicemonitor.yaml
        - Documentation (README)
      validations:
        required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      validations:
        required: true

  - type: input
    id: version
    attributes:
      label: Image Tag / Commit SHA
      description: The deployed image tag or the commit ArgoCD synced to.
      placeholder: bf4f0ea or 0.1.6

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Output
      description: ArgoCD sync status, `kustomize build .` output, or kubectl output.
      render: shell
